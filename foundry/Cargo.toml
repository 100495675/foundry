[package]
name = "foundry"
version = "2.0.0"
edition = "2021"
description = "High-performance zero-copy facade for the foundry ecosystem"

[dependencies]
foundry-core = { path = "../foundry-core" }
foundry-macros = { path = "../foundry-macros" }
rkyv = { version = "0.7.44", features = ["validation"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(foundry_forged)'] }